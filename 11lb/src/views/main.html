<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Розбий блоки для ІПЗ!</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #0095dd;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      margin: 0;
    }

    h1 {
      font-size: 30px;
      color: #fff;
    }

    canvas {
      background: #f0d3d3;
      display: block;
      border-radius: 5px;
    }

    .btn {
      cursor: pointer;
      border: 0;
      padding: 10px 20px;
      background: rgb(25, 1, 70);
      color: #fff;
      border-radius: 5px;
    }

    .btn:focus {
      outline: 0;
    }

    .btn:hover {
      background: #222;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .rules-btn {
      position: absolute;
      top: 10px;
      left: 10px;
    }

    .rules {
      position: absolute;
      top: 0;
      left: 0;
      background: #333;
      color: #fff;
      min-height: 100vh;
      width: 400px;
      padding: 20px;
      line-height: 1.5;
      transform: translateX(-400px);
      transition: transform 1s ease-in-out;
    }

    .rules.show {
      transform: translateX(0);
    }
  </style>
</head>
<body>
  <h1>Лабораторна робота для ІПЗ</h1>
  <button id="rules-btn" class="btn rules-btn">Показати правила гри</button>
  <div id="rules" class="rules">
    <h2>Як грати:</h2>
    <p>
      Використовуй праву та ліву кнопки клавіатури для пересування платформи для того, щоб відбити вгору м'яч і розбивати блоки.
    </p>
    <p>Якщо ви втратите м'яч ваш результат обнулиться, а блоки відновляться</p>
    <button id="close-btn" class="btn">Закрити</button>
  </div>
  <canvas id="canvas" width="800" height="600"></canvas>
  <script src="../app/index.js"></script>
</body>
</html>
